name: Daily predictions

on:
  schedule:
    # 04:30 UTC = 06:30 in Zurich, after the last North-American kickoffs end
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: predict
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run prediction pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.run

      - name: Commit updated predictions
        run: |
          git config user.name "prediction-bot"
          git config user.email "actions@github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update predictions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
